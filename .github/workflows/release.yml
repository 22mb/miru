name: Release

# Triggers:
# - workflow_dispatch: explicit, manual release from the Actions tab.
# - push to main when package.json changes: a merged version bump auto-publishes.
# Both paths converge on the same job. The lightweight `check` job no-ops if a
# release already exists for the current version, so unrelated package.json
# edits (devDependency bumps, script tweaks) and re-runs cost only the check.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - package.json

# Least privilege at the top level; jobs opt into exactly what they need.
permissions: {}

# A release must not be cancelled midway — a partial release is worse than a queued one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Bash enables pipefail, so failures in piped commands aren't swallowed.
defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check release status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Script writes `version` / `publish` to $GITHUB_OUTPUT; no dependencies
      # are required so we skip `bun install`.
      - name: Resolve version and check release
        id: v
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run scripts/check-release.ts

  release:
    name: Build and publish release
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Required for: tag + release creation (contents), Sigstore signing (id-token),
    # and build provenance attestations (attestations).
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Bun version is read from package.json `engines.bun` by setup-bun.
      # `bun build --compile` embeds this runtime into every shipped binary,
      # so the toolchain version is part of the release artifact.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bundle the React frontend (packages/server/src/assets/miru.js + miru.css); these
      # are embedded into each binary by `bun build --compile`, so this must run first.
      # build:front also unblocks the test suite (server.ts text-imports the bundle).
      - name: Build frontend
        run: bun run build:front

      # Re-run the exact gates ci.yml enforces — a release must never outrun them.
      # `bun build --compile` only strips types, it never checks them, so without this
      # a type error or failing test would be baked into an immutable binary. build:front
      # already ran above, which the test suite needs (server.ts text-imports the bundle).
      - name: Typecheck, lint, format, and test
        run: |
          bun run typecheck
          bun run lint
          bun run fmt:check
          bun run test

      # Cross-compile every target from this single Linux runner.
      - name: Build binaries
        run: |
          mkdir -p dist
          build() {
            local target="$1" name="$2"
            echo "Building ${name} (${target})"
            bun build --compile --target="${target}" packages/cli/src/cli.ts --outfile "dist/${name}"
          }
          build bun-linux-x64    miru-linux-x64
          build bun-linux-arm64  miru-linux-arm64
          build bun-darwin-x64   miru-macos-x64
          build bun-darwin-arm64 miru-macos-arm64
          build bun-windows-x64  miru-windows-x64.exe

      # The runner is linux-x64, so this binary runs natively: catch a binary that
      # compiles but dies on launch (asset-embedding regression, runtime init). Only
      # linux-x64 can be exercised here; other targets are still smoke-untested.
      - name: Smoke test (linux-x64)
        run: |
          ./dist/miru-linux-x64 comments README.md | grep -q "No unresolved comments"
          # Once PR #10 (`miru --version`) merges, assert self-reported version == tag,
          # closing the gap between the tag's source (root) and the binary's own claim:
          # test "$(./dist/miru-linux-x64 --version)" = "$VERSION"

      - name: Generate SHA256 checksums
        working-directory: dist
        run: |
          for f in miru-*; do
            sha256sum "$f" > "$f.sha256"
          done

      # Build provenance attestation (Sigstore) for binaries and their checksums.
      # Combined with Immutable Releases (enabled in repo settings), tag and assets
      # become verifiable via `gh release verify` / `gh release verify-asset`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/miru-*

      # Create as a draft targeting the exact commit we built ($GITHUB_SHA), not main
      # HEAD — otherwise a commit landing on main during the build window would make the
      # tag point at a different commit than the binaries' provenance. A draft mints no
      # tag and keeps assets mutable, so a mid-upload failure leaves only an orphan draft
      # instead of a permanent partial public release. Flipping --draft=false is the
      # single atomic moment the tag is cut, once every asset is uploaded.
      - name: Create GitHub Release
        run: |
          # Drop any orphan draft from a failed prior run so the re-run is self-healing.
          # Only a draft can exist here: a published release would have made the check
          # job short-circuit before this job ran, and it is immutable anyway.
          gh release delete "$VERSION" --yes 2>/dev/null || true
          gh release create "$VERSION" dist/* --draft --target "$GITHUB_SHA" --generate-notes
          gh release edit "$VERSION" --draft=false
