name: Bump version

# Manual only, run from the Actions tab to start a release. It opens the version bump
# PR; merging that PR to `main` is what triggers release.yml.
#
# No gates run here. `main` is already green — ci.yml runs on every push to it — and this
# only rewrites one version string, so re-running typecheck/lint/test would just repeat a
# result that already exists. release.yml runs the full set again before it builds
# anything, which is the check that actually guards the release.
#
# ci.yml does still cover the PR this opens, but its run is held for approval first,
# because a pull request opened by Actions is not treated as a human-initiated event.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute the next version, but do not open a PR"
        required: false
        type: boolean
        default: false

# Least privilege at the top level; the job opts into exactly what it needs.
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  bump:
    name: Bump version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `contents: write` pushes the branch, `pull-requests: write` opens the PR.
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # persist-credentials stays at its default (true): this job pushes a branch.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # CalVer, derived from today's date by scripts/bump-version.ts — a same-day re-run
      # appends `.1`, `.2`, and so on. The script only touches package.json through
      # node:fs, so there is nothing to install first.
      - name: Bump version
        id: bump
        run: |
          bun run bump
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git --no-pager diff -- package.json

      - name: Open pull request
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          branch="release/$VERSION"
          git switch -c "$branch"
          git commit -m "chore(release): bump to $VERSION" -- package.json
          # Force-push so a re-run for the same version updates the branch in place.
          git push --force origin "$branch"

          # Written to a file rather than captured with $(cat <<EOF): inside a command
          # substitution, bash reads an apostrophe in the body as an opening quote and
          # the script fails to parse.
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat > /tmp/pr-body.md <<EOF
          Bumps the version to \`$VERSION\`. **Merging this to \`main\` triggers the release workflow.**

          ci.yml starts out waiting for approval on this PR, because the pull request was opened by Actions rather than a person — approve it from the Actions tab to run the checks. They have already passed on \`main\` regardless, and release.yml re-runs them before building.

          Once the release is published, run the tap's Bump formula workflow to update the Homebrew formula.

          Opened by the [Bump version]($run_url) workflow.
          EOF
          gh pr create --title "chore(release): bump to $VERSION" --body-file /tmp/pr-body.md
