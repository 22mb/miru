version: 2
updates:
  # GitHub Actions are pinned to a commit SHA (supply-chain safety). Dependabot bumps
  # the SHA and the trailing `# vX.Y.Z` comment together, so pinning stays maintainable.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # JavaScript deps via Bun. Dependabot covers *version* updates only (>= v1.1.39),
  # not security updates — disclosed CVEs surface via GitHub's Dependabot alerts
  # (enable under repo Settings → Security; the text-format bun.lock is parsed).
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    groups:
      # Collapse routine minor/patch bumps into one weekly PR; majors stay separate.
      minor-and-patch:
        update-types:
          - minor
          - patch
