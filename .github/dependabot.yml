version: 2
updates:
  # GitHub Actions are pinned to a commit SHA (supply-chain safety). Dependabot bumps
  # the SHA and the trailing `# vX.Y.Z` comment together, so pinning stays maintainable.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Don't propose a version until it has been public for three days: hijacked
    # releases are typically caught and unpublished within hours, so a short wait
    # clears most of that exposure. Three days is also Dependabot's built-in default,
    # spelled out here so the window sits next to the matching one in bunfig.toml.
    # Security updates bypass it by design.
    cooldown:
      default-days: 3

  # JavaScript deps via Bun. Dependabot covers *version* updates only (>= v1.1.39),
  # not security updates — disclosed CVEs surface via GitHub's Dependabot alerts
  # (enable under repo Settings → Security; the text-format bun.lock is parsed).
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    # Same three-day hold as above.
    cooldown:
      default-days: 3
    groups:
      # Collapse routine minor/patch bumps into one weekly PR; majors stay separate.
      minor-and-patch:
        update-types:
          - minor
          - patch
