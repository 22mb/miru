# Refuse to resolve any package version published less than three days ago, so a
# hijacked release has time to be caught and unpulled before it can land here. The
# window matches the `cooldown` in .github/dependabot.yml: that one gates what
# Dependabot proposes, this one gates what actually gets written into bun.lock —
# transitive dependencies included, which is the half Dependabot does not manage.
#
# Only new resolution is affected. `bun install --frozen-lockfile` (what CI runs) just
# replays the lockfile, so this never blocks a build; it applies when the lockfile is
# regenerated by hand.
[install]
minimumReleaseAge = 259200
